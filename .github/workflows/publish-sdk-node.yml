name: Publish SDK (Node.js)

on:
  push:
    tags:
      - 'sdk-node-v*'

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 8.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter flowmesh-node test

      - name: Build
        run: pnpm --filter flowmesh-node build

      - name: Publish to npm
        run: pnpm --filter flowmesh-node publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
