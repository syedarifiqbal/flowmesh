version: '3.9'

services:

  # ─── Data Layer ───────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: flowmesh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowmesh
      POSTGRES_USER: flowmesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmesh"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowmesh

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: flowmesh-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flowmesh
      DB_USER: flowmesh
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      AUTH_TYPE: plain
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,search_path
    ports:
      - "5432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - flowmesh

  redis-ephemeral:
    image: redis:7-alpine
    container_name: flowmesh-redis-ephemeral
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowmesh

  redis-persistent:
    image: redis:7-alpine
    container_name: flowmesh-redis-persistent
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
    volumes:
      - redis_persistent_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowmesh

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: flowmesh-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: flowmesh
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: flowmesh
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./init/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json
      - ./init/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - flowmesh

  # ─── Application Services ─────────────────────────────────────

  api-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nestjs
      args:
        SERVICE_NAME: api-gateway
        SERVICE_PORT: 3000
    container_name: flowmesh-api-gateway
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: 3000
      INGESTION_SERVICE_URL: http://ingestion:3001
      CONFIG_SERVICE_URL: http://config-service:3005
      AUTH_SERVICE_URL: http://auth:3004
      PIPELINE_SERVICE_URL: http://pipeline:3002
      ANALYTICS_SERVICE_URL: http://analytics:3006
      DELIVERY_SERVICE_URL: http://delivery:3003
      ALERT_SERVICE_URL: http://alert:3007
      REDIS_EPHEMERAL_URL: redis://redis-ephemeral:6379
      REDIS_PERSISTENT_URL: redis://redis-persistent:6379
    ports:
      - "3000:3000"
    depends_on:
      redis-ephemeral:
        condition: service_healthy
      redis-persistent:
        condition: service_healthy
    networks:
      - flowmesh

  ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nestjs
      args:
        SERVICE_NAME: ingestion
        SERVICE_PORT: 3001
    container_name: flowmesh-ingestion
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://flowmesh:${POSTGRES_PASSWORD}@pgbouncer:5432/flowmesh?schema=ingestion
      RABBITMQ_URL: amqp://flowmesh:${RABBITMQ_PASSWORD}@rabbitmq:5672/flowmesh
      REDIS_EPHEMERAL_URL: redis://redis-ephemeral:6379
      REDIS_PERSISTENT_URL: redis://redis-persistent:6379
    depends_on:
      pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis-persistent:
        condition: service_healthy
    networks:
      - flowmesh

  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nestjs
      args:
        SERVICE_NAME: pipeline
        SERVICE_PORT: 3002
    container_name: flowmesh-pipeline
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://flowmesh:${POSTGRES_PASSWORD}@pgbouncer:5432/flowmesh?schema=pipeline
      RABBITMQ_URL: amqp://flowmesh:${RABBITMQ_PASSWORD}@rabbitmq:5672/flowmesh
      REDIS_EPHEMERAL_URL: redis://redis-ephemeral:6379
      REDIS_PERSISTENT_URL: redis://redis-persistent:6379
      CONFIG_SERVICE_URL: http://config-service:3005
    depends_on:
      rabbitmq:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis-ephemeral:
        condition: service_healthy
      redis-persistent:
        condition: service_healthy
      config-service:
        condition: service_started
    networks:
      - flowmesh

  delivery:
    build:
      context: ../apps/delivery
      dockerfile: Dockerfile
    container_name: flowmesh-delivery
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: 3003
      RABBITMQ_URL: amqp://flowmesh:${RABBITMQ_PASSWORD}@rabbitmq:5672/flowmesh
      CONFIG_SERVICE_URL: http://config-service:3005
      DELIVERY_DATABASE_URL: postgresql://flowmesh:${POSTGRES_PASSWORD}@postgres:5432/flowmesh
    depends_on:
      rabbitmq:
        condition: service_healthy
      config-service:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - flowmesh

  auth:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nestjs
      args:
        SERVICE_NAME: auth
        SERVICE_PORT: 3004
    container_name: flowmesh-auth
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://flowmesh:${POSTGRES_PASSWORD}@pgbouncer:5432/flowmesh?schema=auth
      REDIS_PERSISTENT_URL: redis://redis-persistent:6379
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
    depends_on:
      pgbouncer:
        condition: service_started
      redis-persistent:
        condition: service_healthy
    networks:
      - flowmesh

  config-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nestjs
      args:
        SERVICE_NAME: config-service
        SERVICE_PORT: 3005
    container_name: flowmesh-config
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: 3005
      DATABASE_URL: postgresql://flowmesh:${POSTGRES_PASSWORD}@pgbouncer:5432/flowmesh?schema=config
      REDIS_EPHEMERAL_URL: redis://redis-ephemeral:6379
      DELIVERY_SERVICE_URL: http://delivery:3003
    depends_on:
      pgbouncer:
        condition: service_started
      redis-ephemeral:
        condition: service_healthy
    networks:
      - flowmesh

  analytics:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nestjs
      args:
        SERVICE_NAME: analytics
        SERVICE_PORT: 3006
    container_name: flowmesh-analytics
    restart: unless-stopped
    env_file: ../.env
    environment:
      PORT: 3006
      REDIS_EPHEMERAL_URL: redis://redis-ephemeral:6379
    ports:
      - "3006:3006"
    depends_on:
      redis-ephemeral:
        condition: service_healthy
    networks:
      - flowmesh

  alert:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nestjs
      args:
        SERVICE_NAME: alert
        SERVICE_PORT: 3007
    container_name: flowmesh-alert
    restart: unless-stopped
    environment:
      PORT: 3007
      DATABASE_URL: postgresql://flowmesh:${POSTGRES_PASSWORD}@pgbouncer:5432/flowmesh?schema=alert
      RABBITMQ_URL: amqp://flowmesh:${RABBITMQ_PASSWORD}@rabbitmq:5672/flowmesh
      REDIS_EPHEMERAL_URL: redis://redis-ephemeral:6379
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-alerts@flowmesh.io}"
    ports:
      - "3007:3007"
    depends_on:
      pgbouncer:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      redis-ephemeral:
        condition: service_healthy
    networks:
      - flowmesh

  # ─── Observability ───────────────────────────────────────────

  loki:
    image: grafana/loki:3.0.0
    container_name: flowmesh-loki
    restart: unless-stopped
    volumes:
      - ./config/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flowmesh

  promtail:
    image: grafana/promtail:3.0.0
    container_name: flowmesh-promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Promtail needs the Docker socket to discover containers and read their logs.
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - flowmesh

  grafana:
    image: grafana/grafana:11.0.0
    container_name: flowmesh-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Disable telemetry — this is a self-hosted instance.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3200:3000"
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - flowmesh

  # ─── Edge ─────────────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    container_name: flowmesh-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
    networks:
      - flowmesh

# ─── Volumes ────────────────────────────────────────────────────

volumes:
  postgres_data:
  rabbitmq_data:
  redis_persistent_data:
  loki_data:
  grafana_data:

# ─── Networks ───────────────────────────────────────────────────

networks:
  flowmesh:
    driver: bridge
