events {
  worker_connections 1024;
}

http {
  upstream api_gateway {
    server api-gateway:3000;
  }

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  server {
    listen 80;
    server_name _;

    # /api/* from the dashboard -- strip prefix, forward to gateway.
    # proxy_pass with trailing slash strips the matched location prefix.
    location /api/ {
      limit_req zone=api burst=50 nodelay;

      proxy_pass http://api_gateway/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # Direct API traffic (SDKs, curl, server-to-server -- no /api prefix).
    location / {
      limit_req zone=api burst=50 nodelay;

      proxy_pass http://api_gateway/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 10s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # WebSocket -- sticky session required for live dashboard.
    location /ws/ {
      proxy_pass http://api_gateway/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
  }
}
