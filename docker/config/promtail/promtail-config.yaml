server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: flowmesh-docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      # Use Docker Compose service name as a label (e.g. "pipeline", "ingestion", "postgres").
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      # Strip leading slash from container name.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      # Drop containers with no compose service label (non-compose containers).
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: '.+'
        action: keep

    pipeline_stages:
      # Try to parse the log line as JSON (pino and Go service output JSON in production/docker mode).
      # If parsing fails (postgres, rabbitmq plain text), the stage is skipped silently.
      - json:
          expressions:
            level: level       # pino numeric: 10=trace 20=debug 30=info 40=warn 50=error 60=fatal
            service: service   # set via customProps in each service's LoggerModule

      # Map pino numeric levels to human-readable strings.
      # Non-pino containers will have an empty level — that's fine.
      - template:
          source: level
          template: >-
            {{ if eq .Value "10" }}trace{{ else if eq .Value "20" }}debug{{ else if eq .Value "30" }}info{{ else if eq .Value "40" }}warn{{ else if eq .Value "50" }}error{{ else if eq .Value "60" }}fatal{{ else }}{{ .Value }}{{ end }}

      # Promote to Loki labels. For non-pino containers, service will be empty
      # and compose_service (set above from Docker metadata) acts as the identifier.
      - labels:
          level:
          service:
